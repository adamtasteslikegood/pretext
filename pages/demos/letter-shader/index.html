<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Letter Shader — Pretext Demos</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html, body {
                width: 100vw;
                height: 100vh;
                overflow: hidden;
                background: #000;
                color: #fff;
            }
            #art {
                width: 100%;
                height: 100%;
                font-family: "Courier New", monospace;
                font-size: 12px;
                line-height: 1;
                overflow: hidden;
                white-space: pre;
            }
            #stats {
                position: fixed;
                bottom: 6px;
                left: 0;
                right: 0;
                text-align: center;
                font: 400 10px/1 "Helvetica Neue", sans-serif;
                color: rgba(255, 255, 255, 0.1);
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <div id="art"></div>
        <div id="stats"></div>
        <script type="module" src="./letter-shader.js"></script>
    </body>
</html>
